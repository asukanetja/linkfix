<h1>LinkFix v1.1</h1>
<p>LinkFixは、ショートカット（.lnk）のリンク先と作業フォルダを一括で編集できる無料のWindowsツールです。</p>

<h2>ダウンロード</h2>
<ul>
  <li><a href="LinkFix_Japanese_v1.1.zip">ダウンロード（日本語版）</a></li>
  <li><a href="index.html">English page here</a></li>
</ul>

<h2>主な機能</h2>
<ul>
  <li>ショートカットのリンク先・作業フォルダの一括置換</li>
  <li>CSV出力とログ保存に対応</li>
  <li>インストール不要ですぐに使用可能</li>
</ul>
